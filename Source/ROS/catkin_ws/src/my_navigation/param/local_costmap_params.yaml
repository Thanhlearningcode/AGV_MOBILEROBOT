local_costmap:
  global_frame: map                # giống global
  robot_base_frame: base_link      # giống global
  update_frequency: 10             # giống global  20
  publish_frequency: 10            # cost map hiển thị với tần số này 20
  static_map: true                 # false
  rolling_window: true             # = true: costmap sẽ duy trì ở trung tâm robot
  width: 3.0                       # kích thước của costmap(m/cell)
  height: 3.0
  resolution: 0.1
  transform_tolerance: 1.0   
  
  plugins:
   - {name: static_layer,        type: "costmap_2d::StaticLayer"}
   - {name: obstacle_layer,      type: "costmap_2d::ObstacleLayer"}
